[package]
name = "looking-glass"
version = "0.32.0-preview.2"
edition = "2021"
rust-version = "1.86"
publish = false
description = "Local Rust compatibility research for user-supplied Alice game data"

[features]
default = []
# Local A/B experiment: only frame-boundary wall timing, no GL observers.
frame_total_only = ["vita_renderer"]
# Passive bounded phase1 timing evidence; also requires private config opt-in.
native_timing = []
vita_renderer = []
# Optional actor publication counters; no calls or argument work in regular builds.
actor_diagnostics = ["vita_renderer"]
# Host-only deterministic live-window diagnostics; never used for console packages.
sim_maps_probe = []

[dependencies]
anyhow = "1.0"
macroquad = "=0.4.14"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
image = { version = "=0.24.9", default-features = false, features = ["tga", "jpeg", "png"] }
# Macroquad's newer fontdue patch needs a newer compiler than the user's Rust 1.86.
fontdue = "=0.9.3"
# Independent WAV/MP3 playback; does not load the game's Miles DLLs.
rodio = { version = "=0.20.1", default-features = false, features = ["wav", "symphonia-mp3"] }
hound = "=3.5.1"
# Symphonia metadata's latest encoding_rs patch requires Rust 1.88.
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
# Enable serialization on the same math types used by Macroquad.
glam = { version = "=0.27.0", features = ["serde"] }
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[patch.crates-io]
# Material backend reclamation and single-owner render-target attachments.
macroquad = { git = "https://github.com/Anezium/macroquad", rev = "90f0fe456c40f0b9751c30307feca066ae177db7" }
cpal = { git = "https://github.com/Anezium/cpal", rev = "512acf2e66667059eda67b265ce9d80f68e02b3f" }
# Texture metadata reclamation and idempotent managed deletion, based on 6f89180.
miniquad = { git = "https://github.com/Anezium/miniquad", rev = "aa9e0ea4c3ffb23981993ca2d061002b334df4cb" }

[package.metadata.vita]
title_id = "ALICELG01"
title_name = "Alice Vita (Looking Glass)"
build_std = "std,panic_unwind"
vita_make_fself_flags = ["-s"]
vita_mksfoex_flags = ["-d", "ATTRIBUTE2=12"]

[package.metadata.vita.profile.release]
# vita-elf-create reads sceUserMainThreadStackSize by name; strip-unneeded removes it.
strip_symbols = false
