[package]
name = "looking-glass"
version = "0.32.0-preview.2"
edition = "2021"
rust-version = "1.86"
publish = false
description = "Local Rust compatibility research for user-supplied Alice game data"

[features]
default = []
vita_renderer = []
# Host-only deterministic live-window diagnostics; never used for console packages.
sim_maps_probe = []

[dependencies]
anyhow = "1.0"
macroquad = "=0.4.14"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
image = { version = "=0.24.9", default-features = false, features = ["tga", "jpeg", "png"] }
# Macroquad's newer fontdue patch needs a newer compiler than the user's Rust 1.86.
fontdue = "=0.9.3"
# Independent WAV/MP3 playback; does not load the game's Miles DLLs.
rodio = { version = "=0.20.1", default-features = false, features = ["wav", "symphonia-mp3"] }
hound = "=3.5.1"
# Symphonia metadata's latest encoding_rs patch requires Rust 1.88.
encoding_rs = "=0.8.35"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
# Enable serialization on the same math types used by Macroquad.
glam = { version = "=0.27.0", features = ["serde"] }
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"

[patch.crates-io]
# Branch vita-compact-buffers; Cargo allows only one of branch/tag/rev.
miniquad = { git = "https://github.com/Anezium/miniquad", rev = "6f891804784bf4a5b39313ee6499344cb0d7e8b6" }

[package.metadata.vita]
title_id = "ALICELG01"
title_name = "Alice Vita (Looking Glass)"
build_std = "std,panic_unwind"
vita_make_fself_flags = ["-s"]
vita_mksfoex_flags = ["-d", "ATTRIBUTE2=12"]

[package.metadata.vita.profile.release]
# vita-elf-create reads sceUserMainThreadStackSize by name; strip-unneeded removes it.
strip_symbols = false
